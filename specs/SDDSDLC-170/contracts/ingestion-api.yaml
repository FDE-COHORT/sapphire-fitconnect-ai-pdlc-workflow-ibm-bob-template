# Contract: Temperature Ingestion API
# sapphire-event-ingestion-api
# SDDSDLC-170

openapi: "3.1.0"
info:
  title: Sapphire Health Telemetry Ingestion API — Body Temperature Extension
  version: "1.1.0"
  description: |
    Extension to the existing health telemetry ingestion API to support body temperature
    readings from smart devices and APIs.

paths:
  /telemetry/body-temperature:
    post:
      summary: Ingest a single body temperature reading
      operationId: ingestBodyTemperature
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemperatureReadingRequest'
      responses:
        '202':
          description: Reading accepted and published to event pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemperatureIngestionResponse'
        '401':
          description: Missing or invalid Keycloak JWT
        '422':
          description: Validation failure (out-of-range value, missing field, future timestamp)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '429':
          description: Per-user rate limit exceeded (1,000 readings/minute)
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until the rate limit window resets
        '503':
          description: Kafka topic unavailable; reading not published

  /telemetry/body-temperature/batch:
    post:
      summary: Ingest a batch of body temperature readings (up to 100)
      operationId: ingestBodyTemperatureBatch
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TemperatureReadingBatchRequest'
      responses:
        '207':
          description: |
            Multi-status: partial accept. Valid records published; invalid records
            returned with per-record error details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchIngestionResponse'
        '400':
          description: Empty batch (0 records)
        '401':
          description: Missing or invalid Keycloak JWT
        '422':
          description: Batch exceeds maximum size (> 100 records)
        '429':
          description: Per-user rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
        '503':
          description: Kafka topic unavailable

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    TemperatureReadingRequest:
      type: object
      required: [value, unit, timestamp, device_source, ingestion_source]
      properties:
        value:
          type: number
          format: double
          description: Temperature value in the supplied unit
          example: 37.1
        unit:
          type: string
          enum: [C, F]
          description: Temperature unit (C = Celsius, F = Fahrenheit)
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 UTC timestamp of the measurement
          example: "2025-08-25T09:00:00Z"
        device_source:
          type: string
          maxLength: 128
          description: Device identifier or model name
          example: "smartwatch-model-x1"
        ingestion_source:
          type: string
          maxLength: 64
          description: Source of the ingestion call (api, sdk, manual)
          example: "api"
        measurement_method:
          type: string
          maxLength: 64
          nullable: true
          description: Optional measurement method (oral, axillary, tympanic, etc.)
          example: "oral"

    TemperatureReadingBatchRequest:
      type: object
      required: [readings]
      properties:
        readings:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TemperatureReadingRequest'

    TemperatureIngestionResponse:
      type: object
      properties:
        event_id:
          type: string
          format: uuid
          description: Unique ID assigned to the published Kafka event
        status:
          type: string
          enum: [accepted]

    BatchIngestionResponse:
      type: object
      properties:
        total:
          type: integer
          description: Total records in the batch
        accepted:
          type: integer
          description: Number of records successfully published
        rejected:
          type: integer
          description: Number of records that failed validation
        results:
          type: array
          items:
            $ref: '#/components/schemas/BatchRecordResult'

    BatchRecordResult:
      type: object
      properties:
        index:
          type: integer
          description: Zero-based index of the record in the original batch
        status:
          type: string
          enum: [accepted, rejected]
        event_id:
          type: string
          format: uuid
          nullable: true
          description: Present when status=accepted
        errors:
          type: array
          nullable: true
          items:
            $ref: '#/components/schemas/FieldError'

    ValidationErrorResponse:
      type: object
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'

    FieldError:
      type: object
      properties:
        field:
          type: string
          description: Field that caused the error
          example: "value"
        message:
          type: string
          description: Human-readable error message
          example: "Temperature value 200.0°C exceeds maximum allowed value of 45.0°C"
        rejected_value:
          description: The value that was rejected
